name: Signaler un bug
description: Le logiciel ou le site ne fonctionne pas comme prévu
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler le problème. Ne colle jamais ta **clé personnelle** ici : elle donne accès à ton compte.
  - type: input
    id: version
    attributes:
      label: Version de CStonx
      description: Visible dans l'onglet Réglages du logiciel.
      placeholder: "0.2.4"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Édition
      options:
        - Installée (CStonx-Setup)
        - Portable (zip)
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode de jeu
      options:
        - Premier
        - Compétitif
        - FACEIT
        - Autre / hors partie
  - type: textarea
    id: what
    attributes:
      label: Ce qui s'est passé
      description: Ce que tu faisais, ce que tu attendais, ce qui s'est passé à la place.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Onglet Accueil
      description: Ce qu'affiche l'onglet Accueil du logiciel (une capture suffit).
  - type: textarea
    id: log
    attributes:
      label: Journal
      description: Les dernières lignes de l'onglet Journal du logiciel, si elles parlent du problème.
      render: text
